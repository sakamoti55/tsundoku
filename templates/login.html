<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>ログイン - 積読リスト</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header login-header">
      <div class="container header-top">
        <a class="site-name" href="{{ url_for('index') }}">積読リスト</a>
        <a class="back-link" href="{{ url_for('index') }}">一覧へ戻る</a>
      </div>
    </header>

    <main class="container page-content">
      <section class="login-panel">
        <h1>ログイン</h1>
        <p class="form-description">登録したIDとパスワードを入力します。</p>

        {% if not auth_configured %}
          <div class="auth-switch auth-switch-top">
            <span>管理ユーザーが未登録です。</span>
            <a class="secondary-link" href="{{ url_for('register') }}">新規登録へ</a>
          </div>
        {% endif %}

        {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}

        <form class="login-form" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <label for="user">ID</label>
          <input id="user" name="user" type="text" autocomplete="username" required autofocus>

          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button class="primary-button" type="submit">ログイン</button>
        </form>

      </section>
    </main>
  </body>
</html>
